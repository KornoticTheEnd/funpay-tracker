name: Scrape FunPay and publish report

on:
  schedule:
    - cron: "7 */3 * * *"   # every 3 hours at :07 UTC (GitHub may start it a few minutes late)
  workflow_dispatch: {}      # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  TZ: Europe/Helsinki        # times in the report are shown in this timezone
  STOP_AFTER: "20261201"     # last day (UTC, YYYYMMDD) to collect data

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check collection window
        id: window
        run: |
          if [ "$(date -u +%Y%m%d)" -gt "$STOP_AFTER" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Collection period ended on $STOP_AFTER - skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.window.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.window.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.window.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Scrape
        if: steps.window.outputs.run == 'true'
        run: python funpay_scraper.py --now

      - name: Build report
        if: steps.window.outputs.run == 'true'
        run: python funpay_report.py --out docs

      - name: Commit data and report
        if: steps.window.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
